<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gotti Tracker">
  <meta name="theme-color" content="#09090b">
  <title>Gotti 2-Split Tracker Pro</title>

  <!-- PWA Manifest Integration -->
  <link rel="manifest" id="manifestLink">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><path d='M30 35h40v6H30zm0 12h40v6H30zm0 12h40v6H30z' fill='%23ef4444'/></svg>">

  <!-- Chart.js for inline hypertrophy graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --input-bg: #27272a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 90px);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { font-size: 1.05rem; margin: 0; font-weight: 700; color: var(--text); }
    
    .timer-bar {
      background: #121215;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .timer-display {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }
    .timer-btns { display: flex; gap: 6px; }
    .timer-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .date-bar {
      padding: 10px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .date-input {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .nav-tabs {
      display: flex;
      background: #121215;
      padding: 4px;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      min-width: 75px;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }

    .workout-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .ex-title { font-weight: 700; font-size: 0.95rem; }
    .ex-meta { font-size: 0.75rem; color: var(--accent); margin-top: 2px; }
    .ex-notes { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.3; }

    .chart-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .chart-container {
      display: none;
      margin-top: 12px;
      margin-bottom: 12px;
      height: 160px;
      position: relative;
    }

    .set-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .set-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
    
    input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px;
      font-size: 0.9rem;
      width: 100%;
      text-align: center;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-secondary {
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px) 16px;
      display: flex;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      margin: 10px 0;
      resize: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gotti 2-Split Tracker Pro</h1>
    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px;" onclick="openBackup()">Data</button>
  </header>

  <!-- Rest Timer Header -->
  <div class="timer-bar">
    <div style="font-size: 0.75rem; color: var(--text-muted);">Rest Timer: <span class="timer-display" id="timerDisplay">00:00</span></div>
    <div class="timer-btns">
      <button class="timer-btn" onclick="startTimer(60)">+60s</button>
      <button class="timer-btn" onclick="startTimer(90)">+90s</button>
      <button class="timer-btn" onclick="startTimer(120)">+120s</button>
      <button class="timer-btn" onclick="stopTimer()" style="color: var(--accent);">Stop</button>
    </div>
  </div>

  <!-- Date Selector -->
  <div class="date-bar">
    <span style="font-weight: 600; color: var(--text-muted);">Log Date:</span>
    <input type="date" id="logDate" class="date-input" onchange="onDateChange()">
  </div>

  <div class="nav-tabs" id="tabNav"></div>

  <div class="container" id="workoutContent"></div>

  <div class="bottom-bar">
    <button class="btn" onclick="saveCurrentWorkout()">Save Workout</button>
  </div>

  <!-- Backup/Restore Modal -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <h3 style="margin-top: 0;">Export / Import Data</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Copy string to back up, or paste code to restore onto this device.</p>
      <textarea id="dataBox"></textarea>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="exportData()">Copy Export</button>
        <button class="btn" onclick="importData()">Import Paste</button>
      </div>
      <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeBackup()">Close</button>
    </div>
  </div>

  <script>
    /* PWA Manifest Dynamic Generation */
    const manifestJson = {
      "name": "Gotti 2-Split Tracker Pro",
      "short_name": "Gotti Tracker",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#09090b",
      "theme_color": "#09090b",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><path d='M30 35h40v6H30zm0 12h40v6H30zm0 12h40v6H30z' fill='%23ef4444'/></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifestJson)], {type: 'application/json'});
    document.getElementById('manifestLink').href = URL.createObjectURL(blob);

    /* Service Worker Inline Registration for Offline Support */
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'gotti-tracker-v1';
        const ASSETS = [
          './',
          'https://cdn.jsdelivr.net/npm/chart.js'
        ];

        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
          );
          self.skipWaiting();
        });

        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });

        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((res) => res || fetch(e.request).catch(() => caches.match('./')))
          );
        });
      `;
      const swBlob = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob))
        .catch(err => console.log('SW registration skipped:', err));
    }

    const ROUTINE = {
      "Upper A": [
        { id: "uA1", name: "Lat Pulldown (Narrow)", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid (Heavy → Light). Stretch lats.", sets: [6,8,10,12] },
        { id: "uA2", name: "T-Bar Row (Wide)", meta: "4 Sets: 8, 10, 12, 15", notes: "Reverse Pyramid. Targets upper back.", sets: [8,10,12,15] },
        { id: "uA3", name: "Incline Smith Machine Press", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid. Upper chest focus.", sets: [6,8,10,12] },
        { id: "uA4", name: "Dumbbell Flyes", meta: "3 Sets: 8, 10, 12", notes: "Deep stretch on flat bench.", sets: [8,10,12] },
        { id: "uA5", name: "DB Lateral Raises", meta: "6 Sets: 8 - 15 reps", notes: "Side delt focus (heavy to light).", sets: [8,10,12,12,15,15] },
        { id: "uA6", name: "Rope Pushdowns", meta: "4 Sets: 15 down to 8", notes: "Standard Pyramid (Light → Heavy). Burnout.", sets: [15,12,10,8] },
        { id: "uA7", name: "EZ-Bar Curls", meta: "4 Sets: 15 down to 8", notes: "Standard Pyramid (Light → Heavy).", sets: [15,12,10,8] }
      ],
      "Lower A": [
        { id: "lA1", name: "Pendulum / Hack Squat", meta: "4 Sets: 20 down to 10", notes: "Quad focus. Narrow stance, deep ROM.", sets: [20,15,12,10] },
        { id: "lA2", name: "Leg Extensions", meta: "3 Sets: 8, 10, 12", notes: "Reverse Pyramid isolation.", sets: [8,10,12] },
        { id: "lA3", name: "Leg Curls", meta: "3 Sets: 8, 10, 12", notes: "Reverse Pyramid hamstrings.", sets: [8,10,12] },
        { id: "lA4", name: "Calf Raises", meta: "4 Sets: 10 - 15 reps", notes: "Full stretch and peak contraction.", sets: [12,12,12,12] }
      ],
      "Upper B": [
        { id: "uB1", name: "Wide Pull-Ups", meta: "2 Sets: Max (>= 8 reps)", notes: "Bodyweight or assisted.", sets: [8,8] },
        { id: "uB2", name: "Seated Cable Row (Narrow)", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid heavy compound.", sets: [6,8,10,12] },
        { id: "uB3", name: "Reverse Butterfly", meta: "3 Sets: 10 - 15 reps", notes: "Rear delts and upper back.", sets: [12,12,12] },
        { id: "uB4", name: "Flat DB Bench Press", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid. 90 degree arm position.", sets: [6,8,10,12] },
        { id: "uB5", name: "Cable Cross-overs", meta: "3 Sets: 8 - 12 reps", notes: "Peak squeeze focus.", sets: [10,10,10] },
        { id: "uB6", name: "Cable Lateral Raises", meta: "4-6 Sets: 20 down to 8", notes: "High rep burnout.", sets: [20,15,12,10] },
        { id: "uB7", name: "French Press", meta: "4 Sets: 15 down to 8", notes: "Overhead/stretched triceps head.", sets: [15,12,10,8] },
        { id: "uB8", name: "Incline DB Curls", meta: "4 Sets: 15 down to 8", notes: "Arms behind body for stretch.", sets: [15,12,10,8] }
      ],
      "Lower B": [
        { id: "lB1", name: "Walking DB Lunges", meta: "4-6 Laps / Sets", notes: "Hamstring/Glute focus. Long strides.", sets: [12,12,12,12] },
        { id: "lB2", name: "Leg Extensions", meta: "3 Sets: 20 down to 10", notes: "High rep burnout.", sets: [20,15,10] },
        { id: "lB3", name: "Leg Curls", meta: "3 Sets: 20 down to 10", notes: "High rep burnout.", sets: [20,15,10] },
        { id: "lB4", name: "Calf Raises", meta: "4 Sets: 10 - 15 reps", notes: "Standard heavy calf work.", sets: [12,12,12,12] }
      ]
    };

    let activeTab = "Upper A";
    let userData = JSON.parse(localStorage.getItem("gotti_workout_logs_v2")) || {};
    let chartInstances = {};
    let timerInterval = null;
    let timerTimeLeft = 0;

    function init() {
      document.getElementById("logDate").value = getTodayString();
      renderTabs();
      renderWorkout(activeTab);
    }

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    function onDateChange() {
      renderWorkout(activeTab);
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerTimeLeft = seconds;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerTimeLeft--;
        updateTimerDisplay();
        if (timerTimeLeft <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          alert("Rest time complete!");
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerTimeLeft = 0;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const m = Math.floor(timerTimeLeft / 60).toString().padStart(2, '0');
      const s = (timerTimeLeft % 60).toString().padStart(2, '0');
      document.getElementById("timerDisplay").innerText = `${m}:${s}`;
    }

    function renderTabs() {
      const tabNav = document.getElementById("tabNav");
      tabNav.innerHTML = Object.keys(ROUTINE).map(tab => `
        <button class="tab-btn ${tab === activeTab ? 'active' : ''}" onclick="switchTab('${tab}')">${tab}</button>
      `).join('');
    }

    function switchTab(tabKey) {
      activeTab = tabKey;
      renderTabs();
      renderWorkout(activeTab);
    }

    function renderWorkout(tabKey) {
      const container = document.getElementById("workoutContent");
      const exercises = ROUTINE[tabKey];
      const selectedDate = document.getElementById("logDate").value;
      const dayData = (userData[selectedDate] && userData[selectedDate][tabKey]) ? userData[selectedDate][tabKey] : {};

      container.innerHTML = exercises.map(ex => {
        const savedEx = dayData[ex.id] || [];
        return `
          <div class="workout-card">
            <div class="ex-header">
              <div>
                <div class="ex-title">${ex.name}</div>
                <div class="ex-meta">${ex.meta}</div>
              </div>
              <button class="chart-toggle" onclick="toggleChart('${ex.id}')">📈 Progress</button>
            </div>
            <div class="ex-notes">${ex.notes}</div>
            <div class="chart-container" id="chart_wrap_${ex.id}">
              <canvas id="canvas_${ex.id}"></canvas>
            </div>
            ${ex.sets.map((targetReps, idx) => {
              const savedSet = savedEx[idx] || {};
              const weightVal = savedSet.weight !== undefined ? savedSet.weight : '';
              const repsVal = savedSet.reps !== undefined ? savedSet.reps : targetReps;
              return `
                <div class="set-row">
                  <div class="set-label">Set ${idx + 1}</div>
                  <input type="number" step="0.5" placeholder="kg/lbs" id="${ex.id}_w_${idx}" value="${weightVal}">
                  <input type="number" placeholder="Reps" id="${ex.id}_r_${idx}" value="${repsVal}">
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    function toggleChart(exId) {
      const wrap = document.getElementById(`chart_wrap_${exId}`);
      if (wrap.style.display === "block") {
        wrap.style.display = "none";
      } else {
        wrap.style.display = "block";
        renderChart(exId);
      }
    }

    function renderChart(exId) {
      const canvas = document.getElementById(`canvas_${exId}`);
      const ctx = canvas.getContext('2d');
      
      const now = new Date();
      const cutoff = new Date();
      cutoff.setDate(now.getDate() - 60);

      const labels = [];
      const weightData = [];

      Object.keys(userData).sort().forEach(dateStr => {
        const d = new Date(dateStr);
        if (d >= cutoff && d <= now) {
          const dayLogs = userData[dateStr];
          let maxW = 0;
          Object.keys(dayLogs).forEach(tab => {
            if (dayLogs[tab][exId]) {
              dayLogs[tab][exId].forEach(s => {
                if (s.weight && parseFloat(s.weight) > maxW) {
                  maxW = parseFloat(s.weight);
                }
              });
            }
          });
          if (maxW > 0) {
            labels.push(dateStr.slice(5));
            weightData.push(maxW);
          }
        }
      });

      if (chartInstances[exId]) {
        chartInstances[exId].destroy();
      }

      chartInstances[exId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['No Data'],
          datasets: [{
            label: 'Max Weight (60 Days)',
            data: weightData.length ? weightData : [0],
            borderColor: '#ef4444',
            backgroundColor: 'rgba(239, 68, 68, 0.15)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#a1a1aa', font: { size: 9 } } },
            y: { ticks: { color: '#a1a1aa', font: { size: 9 } } }
          }
        }
      });
    }

    function saveCurrentWorkout() {
      const selectedDate = document.getElementById("logDate").value;
      if (!userData[selectedDate]) userData[selectedDate] = {};
      if (!userData[selectedDate][activeTab]) userData[selectedDate][activeTab] = {};

      const exercises = ROUTINE[activeTab];

      exercises.forEach(ex => {
        userData[selectedDate][activeTab][ex.id] = ex.sets.map((_, idx) => {
          const w = document.getElementById(`${ex.id}_w_${idx}`).value;
          const r = document.getElementById(`${ex.id}_r_${idx}`).value;
          return { weight: w !== '' ? parseFloat(w) : '', reps: r !== '' ? parseInt(r) : '' };
        });
      });

      localStorage.setItem("gotti_workout_logs_v2", JSON.stringify(userData));
      alert(`Saved ${activeTab} for ${selectedDate}!`);
    }

    function openBackup() {
      document.getElementById("dataBox").value = JSON.stringify(userData);
      document.getElementById("backupModal").style.display = "flex";
    }

    function closeBackup() {
      document.getElementById("backupModal").style.display = "none";
    }

    function exportData() {
      const box = document.getElementById("dataBox");
      box.select();
      navigator.clipboard.writeText(box.value);
      alert("Data copied to clipboard!");
    }

    function importData() {
      const box = document.getElementById("dataBox");
      try {
        const parsed = JSON.parse(box.value);
        if (typeof parsed === 'object') {
          userData = parsed;
          localStorage.setItem("gotti_workout_logs_v2", JSON.stringify(userData));
          renderWorkout(activeTab);
          alert("Import successful!");
          closeBackup();
        }
      } catch (e) {
        alert("Invalid JSON data string.");
      }
    }

    init();
  </script>
</body>
</html>
