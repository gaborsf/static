<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gotti Tracker">
  <meta name="theme-color" content="#09090b">
  <title>Gotti 2-Split Tracker Pro</title>

  <!-- PWA Manifest Integration -->
  <link rel="manifest" id="manifestLink">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><path d='M30 35h40v6H30zm0 12h40v6H30zm0 12h40v6H30z' fill='%23ef4444'/></svg>">

  <!-- Chart.js for multi-set progress graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --input-bg: #27272a;
      --rt-accent: #0a84ff;
      --rt-danger: #ff453a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 90px);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { font-size: 1.05rem; margin: 0; font-weight: 700; color: var(--text); }
    
    .timer-trigger-bar {
      background: #121215;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer-trigger-btn {
      background: var(--rt-accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .date-bar {
      padding: 10px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    
    .date-input {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .nav-tabs {
      display: flex;
      background: #121215;
      padding: 4px;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      min-width: 75px;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }

    .workout-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .ex-title { font-weight: 700; font-size: 0.95rem; }
    .ex-meta { font-size: 0.75rem; color: var(--accent); margin-top: 2px; }
    .ex-notes { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.3; }

    .chart-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .chart-container {
      display: none;
      margin-top: 12px;
      margin-bottom: 12px;
      height: 220px;
      position: relative;
    }

    .set-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .set-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
    
    input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px;
      font-size: 0.9rem;
      width: 100%;
      text-align: center;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn-secondary {
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px) 16px;
      display: flex;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .history-container {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 10px 0;
      max-height: 180px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-date {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .history-tag {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      margin-left: 4px;
    }

    /* Mobile Rest Timer Bottom Sheet Overlay */
    .rt-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .rt-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .rt-modal-card {
      width: 100%;
      max-width: 500px;
      background-color: #121215;
      border: 1px solid var(--border);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px 20px calc(env(safe-area-inset-bottom) + 24px) 20px;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.6);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rt-modal-overlay.active .rt-modal-card {
      transform: translateY(0);
    }

    .rt-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .rt-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .rt-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      line-height: 1;
      padding: 4px 12px;
      cursor: pointer;
    }

    .rt-display-container {
      text-align: center;
      margin: 8px 0 16px 0;
    }

    .rt-time-text {
      font-size: 64px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .rt-progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 14px;
      overflow: hidden;
    }

    .rt-progress-fill {
      height: 100%;
      width: 100%;
      background: var(--rt-accent);
      transition: width 0.2s linear;
    }

    .rt-preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .rt-quick-set-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .rt-action-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .rt-btn {
      min-height: 48px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rt-btn:active, .rt-chip:active {
      transform: scale(0.97);
    }

    .rt-btn-primary { background-color: var(--rt-accent); color: #ffffff; }
    .rt-btn-secondary { background-color: var(--input-bg); color: var(--text); font-size: 0.9rem; }
    .rt-btn-danger { background-color: rgba(255, 69, 58, 0.15); color: var(--rt-danger); }

    .rt-chip {
      min-height: 36px;
      border-radius: 18px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    @media (min-width: 600px) {
      .rt-modal-overlay { align-items: center; }
      .rt-modal-card { border-radius: 24px; transform: translateY(20px); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Gotti 2-Split Tracker Pro</h1>
    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px;" onclick="openBackup()">Data</button>
  </header>

  <!-- Rest Timer Header Bar -->
  <div class="timer-trigger-bar">
    <div style="font-size: 0.8rem; color: var(--text-muted);">
      Timer Status: <span id="headerTimerStatus" style="color: var(--rt-accent); font-weight: 700;">Idle</span>
    </div>
    <button class="timer-trigger-btn" onclick="RestTimer.open(90)">⏱️ Open Timer</button>
  </div>

  <!-- Date Selector -->
  <div class="date-bar">
    <span style="font-weight: 600; color: var(--text-muted);">Log Date:</span>
    <input type="date" id="logDate" class="date-input" onchange="onDateChange()">
  </div>

  <div class="nav-tabs" id="tabNav"></div>

  <div class="container" id="workoutContent"></div>

  <div class="bottom-bar">
    <button class="btn" onclick="saveCurrentWorkout()">Save Workout</button>
  </div>

  <!-- Mobile Rest Timer Modal Popup -->
  <div id="rest-timer-modal" class="rt-modal-overlay" aria-hidden="true">
    <div class="rt-modal-card">
      <div class="rt-modal-header">
        <span class="rt-title">REST TIMER</span>
        <button class="rt-close-btn" onclick="RestTimer.close()">&times;</button>
      </div>

      <div class="rt-display-container">
        <div id="rt-time-display" class="rt-time-text">01:30</div>
        <div class="rt-progress-bar">
          <div id="rt-progress-fill" class="rt-progress-fill"></div>
        </div>
      </div>

      <div class="rt-preset-grid">
        <button class="rt-btn rt-btn-secondary" onclick="RestTimer.addSeconds(-15)">-15s</button>
        <button class="rt-btn rt-btn-secondary" onclick="RestTimer.addSeconds(15)">+15s</button>
        <button class="rt-btn rt-btn-secondary" onclick="RestTimer.addSeconds(30)">+30s</button>
        <button class="rt-btn rt-btn-secondary" onclick="RestTimer.addSeconds(60)">+60s</button>
      </div>

      <div class="rt-quick-set-row">
        <button class="rt-chip" onclick="RestTimer.setDuration(60)">60s</button>
        <button class="rt-chip" onclick="RestTimer.setDuration(90)">90s</button>
        <button class="rt-chip" onclick="RestTimer.setDuration(120)">2m</button>
        <button class="rt-chip" onclick="RestTimer.setDuration(180)">3m</button>
      </div>

      <div class="rt-action-row">
        <button id="rt-toggle-btn" class="rt-btn rt-btn-primary" onclick="RestTimer.toggle()">PAUSE</button>
        <button class="rt-btn rt-btn-danger" onclick="RestTimer.stop()">SKIP</button>
      </div>
    </div>
  </div>

  <!-- Data Management & History Modal -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <h3 style="margin-top: 0; margin-bottom: 4px;">Data & Workout History</h3>
      
      <!-- Recent Logged Workouts History -->
      <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Recent Workout History:</label>
      <div class="history-container" id="workoutHistoryList">
        <!-- Rendered dynamically -->
      </div>

      <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-top: 6px; margin-bottom: 6px;">Backup / Restore (JSON File):</label>
      
      <!-- Hidden File Input for Native Selector -->
      <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;" onchange="handleFileImport(event)">

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="exportDataFile()">Export Backup File</button>
        <button class="btn" onclick="triggerFileImport()">Import Backup File</button>
      </div>

      <button class="btn btn-secondary" style="margin-top: 12px;" onclick="closeBackup()">Close</button>
    </div>
  </div>

  <script>
    /* PWA Manifest Dynamic Generation */
    const manifestJson = {
      "name": "Gotti 2-Split Tracker Pro",
      "short_name": "Gotti Tracker",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#09090b",
      "theme_color": "#09090b",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><path d='M30 35h40v6H30zm0 12h40v6H30zm0 12h40v6H30z' fill='%23ef4444'/></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifestJson)], {type: 'application/json'});
    document.getElementById('manifestLink').href = URL.createObjectURL(blob);

    /* Service Worker Inline Registration */
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'gotti-tracker-v6';
        const ASSETS = ['./', 'https://cdn.jsdelivr.net/npm/chart.js'];
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(ASSETS)));
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request).catch(() => caches.match('./'))));
        });
      `;
      const swBlob = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW setup skipped:', err));
    }

    const ROUTINE = {
      "Upper A": [
        { id: "uA1", name: "Lat Pulldown (Narrow)", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid (Heavy → Light). Stretch lats.", sets: [6,8,10,12] },
        { id: "uA2", name: "T-Bar Row (Wide)", meta: "4 Sets: 8, 10, 12, 15", notes: "Reverse Pyramid. Targets upper back.", sets: [8,10,12,15] },
        { id: "uA3", name: "Incline Smith Machine Press", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid. Upper chest focus.", sets: [6,8,10,12] },
        { id: "uA4", name: "Dumbbell Flyes", meta: "3 Sets: 8, 10, 12", notes: "Deep stretch on flat bench.", sets: [8,10,12] },
        { id: "uA5", name: "DB Lateral Raises", meta: "6 Sets: 8 - 15 reps", notes: "Side delt focus (heavy to light).", sets: [8,10,12,12,15,15] },
        { id: "uA6", name: "Rope Pushdowns", meta: "4 Sets: 15 down to 8", notes: "Standard Pyramid (Light → Heavy). Burnout.", sets: [15,12,10,8] },
        { id: "uA7", name: "EZ-Bar Curls", meta: "4 Sets: 15 down to 8", notes: "Standard Pyramid (Light → Heavy).", sets: [15,12,10,8] }
      ],
      "Lower A": [
        { id: "lA1", name: "Pendulum / Hack Squat", meta: "4 Sets: 20 down to 10", notes: "Quad focus. Narrow stance, deep ROM.", sets: [20,15,12,10] },
        { id: "lA2", name: "Leg Extensions", meta: "3 Sets: 8, 10, 12", notes: "Reverse Pyramid isolation.", sets: [8,10,12] },
        { id: "lA3", name: "Leg Curls", meta: "3 Sets: 8, 10, 12", notes: "Reverse Pyramid hamstrings.", sets: [8,10,12] },
        { id: "lA4", name: "Calf Raises", meta: "4 Sets: 10 - 15 reps", notes: "Full stretch and peak contraction.", sets: [12,12,12,12] }
      ],
      "Upper B": [
        { id: "uB1", name: "Wide Pull-Ups", meta: "2 Sets: Max (>= 8 reps)", notes: "Bodyweight or assisted.", sets: [8,8] },
        { id: "uB2", name: "Seated Cable Row (Narrow)", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid heavy compound.", sets: [6,8,10,12] },
        { id: "uB3", name: "Reverse Butterfly", meta: "3 Sets: 10 - 15 reps", notes: "Rear delts and upper back.", sets: [12,12,12] },
        { id: "uB4", name: "Flat DB Bench Press", meta: "4 Sets: 6, 8, 10, 12", notes: "Reverse Pyramid. 90 degree arm position.", sets: [6,8,10,12] },
        { id: "uB5", name: "Cable Cross-overs", meta: "3 Sets: 8 - 12 reps", notes: "Peak squeeze focus.", sets: [10,10,10] },
        { id: "uB6", name: "Cable Lateral Raises", meta: "4-6 Sets: 20 down to 8", notes: "High rep burnout.", sets: [20,15,12,10] },
        { id: "uB7", name: "French Press", meta: "4 Sets: 15 down to 8", notes: "Overhead/stretched triceps head.", sets: [15,12,10,8] },
        { id: "uB8", name: "Incline DB Curls", meta: "4 Sets: 15 down to 8", notes: "Arms behind body for stretch.", sets: [15,12,10,8] }
      ],
      "Lower B": [
        { id: "lB1", name: "Walking DB Lunges", meta: "4-6 Laps / Sets", notes: "Hamstring/Glute focus. Long strides.", sets: [12,12,12,12] },
        { id: "lB2", name: "Leg Extensions", meta: "3 Sets: 20 down to 10", notes: "High rep burnout.", sets: [20,15,10] },
        { id: "lB3", name: "Leg Curls", meta: "3 Sets: 20 down to 10", notes: "High rep burnout.", sets: [20,15,10] },
        { id: "lB4", name: "Calf Raises", meta: "4 Sets: 10 - 15 reps", notes: "Standard heavy calf work.", sets: [12,12,12,12] }
      ]
    };

    let activeTab = "Upper A";
    let userData = JSON.parse(localStorage.getItem("gotti_workout_logs_v2")) || {};
    let chartInstances = {};

    /* Color Palette for Multi-Set Lines */
    const SET_COLORS = [
      { border: '#ef4444', bg: 'rgba(239, 68, 68, 0.2)' },  
      { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.2)' },  
      { border: '#10b981', bg: 'rgba(16, 185, 129, 0.2)' }, 
      { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.2)' }, 
      { border: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.2)' }, 
      { border: '#ec4899', bg: 'rgba(236, 72, 153, 0.2)' }  
    ];

    /* Rest Timer Controller */
    const RestTimer = (() => {
      let totalDuration = 90;
      let remainingSeconds = 90;
      let timerInterval = null;
      let isPaused = false;

      function formatTime(sec) {
        const mins = Math.floor(sec / 60);
        const secs = sec % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function updateDisplay() {
        const displayEl = document.getElementById('rt-time-display');
        const progressFillEl = document.getElementById('rt-progress-fill');
        const statusEl = document.getElementById('headerTimerStatus');

        if (displayEl) displayEl.textContent = formatTime(remainingSeconds);
        if (statusEl) statusEl.textContent = remainingSeconds > 0 ? formatTime(remainingSeconds) : 'Idle';

        if (progressFillEl) {
          const progressPercent = totalDuration > 0 ? (remainingSeconds / totalDuration) * 100 : 0;
          progressFillEl.style.width = `${progressPercent}%`;
        }
      }

      function tick() {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          stop();
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          alert("Rest interval complete!");
        }
      }

      function open(durationInSeconds = 90) {
        const modalEl = document.getElementById('rest-timer-modal');
        if (remainingSeconds === 0 || durationInSeconds !== totalDuration) {
          setDuration(durationInSeconds);
        }
        if (modalEl) {
          modalEl.classList.add('active');
          modalEl.setAttribute('aria-hidden', 'false');
        }
        if (!timerInterval && !isPaused) start();
      }

      function close() {
        const modalEl = document.getElementById('rest-timer-modal');
        if (modalEl) {
          modalEl.classList.remove('active');
          modalEl.setAttribute('aria-hidden', 'true');
        }
      }

      function start() {
        clearInterval(timerInterval);
        isPaused = false;
        const toggleBtnEl = document.getElementById('rt-toggle-btn');
        if (toggleBtnEl) {
          toggleBtnEl.textContent = 'PAUSE';
          toggleBtnEl.classList.remove('rt-btn-secondary');
          toggleBtnEl.classList.add('rt-btn-primary');
        }
        timerInterval = setInterval(tick, 1000);
      }

      function toggle() {
        const toggleBtnEl = document.getElementById('rt-toggle-btn');
        if (isPaused) {
          start();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          isPaused = true;
          if (toggleBtnEl) {
            toggleBtnEl.textContent = 'RESUME';
            toggleBtnEl.classList.remove('rt-btn-primary');
            toggleBtnEl.classList.add('rt-btn-secondary');
          }
        }
      }

      function stop() {
        clearInterval(timerInterval);
        timerInterval = null;
        remainingSeconds = 0;
        isPaused = false;
        updateDisplay();
        close();
      }

      function setDuration(seconds) {
        totalDuration = seconds;
        remainingSeconds = seconds;
        updateDisplay();
        if (timerInterval && !isPaused) start();
      }

      function addSeconds(seconds) {
        remainingSeconds = Math.max(0, remainingSeconds + seconds);
        totalDuration = Math.max(totalDuration, remainingSeconds);
        updateDisplay();
      }

      return { open, close, toggle, stop, setDuration, addSeconds };
    })();

    function init() {
      document.getElementById("logDate").value = getTodayString();
      renderTabs();
      renderWorkout(activeTab);
    }

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    function onDateChange() {
      renderWorkout(activeTab);
    }

    function renderTabs() {
      const tabNav = document.getElementById("tabNav");
      tabNav.innerHTML = Object.keys(ROUTINE).map(tab => `
        <button class="tab-btn ${tab === activeTab ? 'active' : ''}" onclick="switchTab('${tab}')">${tab}</button>
      `).join('');
    }

    function switchTab(tabKey) {
      activeTab = tabKey;
      renderTabs();
      renderWorkout(activeTab);
    }

    function renderWorkout(tabKey) {
      const container = document.getElementById("workoutContent");
      const exercises = ROUTINE[tabKey];
      const selectedDate = document.getElementById("logDate").value;
      const dayData = (userData[selectedDate] && userData[selectedDate][tabKey]) ? userData[selectedDate][tabKey] : {};

      container.innerHTML = exercises.map(ex => {
        const savedEx = dayData[ex.id] || [];
        return `
          <div class="workout-card">
            <div class="ex-header">
              <div>
                <div class="ex-title">${ex.name}</div>
                <div class="ex-meta">${ex.meta}</div>
              </div>
              <button class="chart-toggle" onclick="toggleChart('${ex.id}')">📈 Progress</button>
            </div>
            <div class="ex-notes">${ex.notes}</div>
            <div class="chart-container" id="chart_wrap_${ex.id}">
              <canvas id="canvas_${ex.id}"></canvas>
            </div>
            ${ex.sets.map((targetReps, idx) => {
              const savedSet = savedEx[idx] || {};
              const weightVal = savedSet.weight !== undefined ? savedSet.weight : '';
              const repsVal = savedSet.reps !== undefined ? savedSet.reps : targetReps;
              return `
                <div class="set-row">
                  <div class="set-label">Set ${idx + 1}</div>
                  <input type="number" step="0.5" placeholder="kg/lbs" id="${ex.id}_w_${idx}" value="${weightVal}">
                  <input type="number" placeholder="Reps" id="${ex.id}_r_${idx}" value="${repsVal}">
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    function toggleChart(exId) {
      const wrap = document.getElementById(`chart_wrap_${exId}`);
      if (wrap.style.display === "block") {
        wrap.style.display = "none";
      } else {
        wrap.style.display = "block";
        renderChart(exId);
      }
    }

    function renderChart(exId) {
      const canvas = document.getElementById(`canvas_${exId}`);
      const ctx = canvas.getContext('2d');
      const now = new Date();
      const cutoff = new Date();
      cutoff.setDate(now.getDate() - 60);

      let exConfig = null;
      Object.keys(ROUTINE).forEach(tab => {
        const found = ROUTINE[tab].find(e => e.id === exId);
        if (found) exConfig = found;
      });

      const numSets = exConfig ? exConfig.sets.length : 4;
      const dates = [];

      Object.keys(userData).sort().forEach(dateStr => {
        const d = new Date(dateStr);
        if (d >= cutoff && d <= now) {
          const dayLogs = userData[dateStr];
          let hasEx = false;
          Object.keys(dayLogs).forEach(tab => {
            if (dayLogs[tab][exId]) hasEx = true;
          });
          if (hasEx) dates.push(dateStr);
        }
      });

      const datasets = [];
      for (let sIdx = 0; sIdx < numSets; sIdx++) {
        const targetReps = exConfig && exConfig.sets[sIdx] ? exConfig.sets[sIdx] : `Set ${sIdx + 1}`;
        const color = SET_COLORS[sIdx % SET_COLORS.length];
        
        const setWeights = dates.map(dateStr => {
          const dayLogs = userData[dateStr];
          let weightVal = null;
          Object.keys(dayLogs).forEach(tab => {
            if (dayLogs[tab][exId] && dayLogs[tab][exId][sIdx]) {
              const setObj = dayLogs[tab][exId][sIdx];
              if (setObj.weight !== "" && setObj.weight !== null && setObj.weight !== undefined) {
                weightVal = parseFloat(setObj.weight);
              }
            }
          });
          return weightVal;
        });

        datasets.push({
          label: `Set ${sIdx + 1} (${targetReps} reps)`,
          data: setWeights,
          borderColor: color.border,
          backgroundColor: color.bg,
          borderWidth: 2,
          pointRadius: 3,
          spanGaps: true,
          tension: 0.2
        });
      }

      if (chartInstances[exId]) {
        chartInstances[exId].destroy();
      }

      chartInstances[exId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates.length ? dates.map(d => d.slice(5)) : ['No Data'],
          datasets: dates.length ? datasets : []
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { color: '#a1a1aa', font: { size: 10 }, boxWidth: 10, padding: 8 }
            },
            tooltip: {
              callbacks: {
                label: (context) => `${context.dataset.label}: ${context.raw !== null ? context.raw + ' kg/lb' : 'N/A'}`
              }
            }
          },
          scales: {
            x: { ticks: { color: '#a1a1aa', font: { size: 9 } } },
            y: {
              ticks: { color: '#a1a1aa', font: { size: 9 } },
              title: { display: true, text: 'Weight (kg/lb)', color: '#a1a1aa', font: { size: 10 } }
            }
          }
        }
      });
    }

    function saveCurrentWorkout() {
      const selectedDate = document.getElementById("logDate").value;
      if (!userData[selectedDate]) userData[selectedDate] = {};

      const exercises = ROUTINE[activeTab];
      let hasData = false;
      const workoutLogs = {};

      exercises.forEach(ex => {
        const setLogs = ex.sets.map((_, idx) => {
          const w = document.getElementById(`${ex.id}_w_${idx}`).value;
          const r = document.getElementById(`${ex.id}_r_${idx}`).value;
          if (w !== '' || r !== '') hasData = true;
          return { weight: w !== '' ? parseFloat(w) : '', reps: r !== '' ? parseInt(r) : '' };
        });
        workoutLogs[ex.id] = setLogs;
      });

      if (hasData) {
        userData[selectedDate][activeTab] = workoutLogs;
      }

      localStorage.setItem("gotti_workout_logs_v2", JSON.stringify(userData));
      alert(`Saved ${activeTab} for ${selectedDate}!`);
    }

    function openBackup() {
      renderWorkoutHistory();
      document.getElementById("backupModal").style.display = "flex";
    }

    function renderWorkoutHistory() {
      const container = document.getElementById("workoutHistoryList");
      const sortedDates = Object.keys(userData).sort().reverse();

      if (sortedDates.length === 0) {
        container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.75rem; text-align: center; padding: 10px;">No workout history logged yet.</div>`;
        return;
      }

      const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      container.innerHTML = sortedDates.map(dateStr => {
        const dateObj = new Date(dateStr + 'T00:00:00');
        const dayName = daysOfWeek[dateObj.getDay()];
        const dayLogs = userData[dateStr] || {};
        
        const completedWorkouts = Object.keys(dayLogs).filter(tabKey => {
          const tabObj = dayLogs[tabKey];
          return Object.keys(tabObj).some(exId => {
            const setsArr = tabObj[exId];
            return Array.isArray(setsArr) && setsArr.some(s => s.weight !== '' || s.reps !== '');
          });
        });

        if (completedWorkouts.length === 0) return '';

        return `
          <div class="history-item">
            <span class="history-date">${dateStr} (${dayName})</span>
            <div>
              ${completedWorkouts.map(w => `<span class="history-tag">${w}</span>`).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function closeBackup() {
      document.getElementById("backupModal").style.display = "none";
    }

    /* Direct File Export Helper */
    function exportDataFile() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "Gotti_Workout_Backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    /* Native File Selector Trigger */
    function triggerFileImport() {
      document.getElementById("importFileInput").click();
    }

    /* Handle JSON File Input Upload */
    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (typeof parsed === 'object' && parsed !== null) {
            userData = parsed;
            localStorage.setItem("gotti_workout_logs_v2", JSON.stringify(userData));
            renderWorkout(activeTab);
            renderWorkoutHistory();
            alert("Workout data imported successfully!");
            closeBackup();
          } else {
            alert("Invalid data file format.");
          }
        } catch (err) {
          alert("Error parsing JSON file. Please ensure it is a valid backup file.");
        }
      };
      reader.readAsText(file);
      // Reset input value to allow re-importing the same file if needed
      event.target.value = '';
    }

    init();
  </script>
</body>
