<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gotti 2-Split Tracker Pro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --green: #10b981;
      --red: #ef4444;
      --gray: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header { background: var(--card-bg); padding: 1rem; border-bottom: 1px solid var(--border); text-align: center; }
    header h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }

    .container { max-width: 600px; margin: 0 auto; padding: 1rem; }

    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 1rem; margin-bottom: 1rem; }
    .card-title { font-weight: 600; margin-bottom: 0.75rem; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }

    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    input, select, button { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.95rem; margin-bottom: 0.75rem; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.5rem; align-items: center; }

    .exercise-row { padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .exercise-row:last-child { border-bottom: none; }

    /* Sticky Bottom Toolbar */
    .sticky-actions {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card-bg); border-top: 1px solid var(--border);
      padding: 0.75rem 1rem; display: flex; gap: 0.75rem;
      max-width: 600px; margin: 0 auto; z-index: 100;
    }

    .btn { cursor: pointer; font-weight: 600; border: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .btn-primary { background: var(--accent); color: white; margin: 0; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--border); color: var(--text); margin: 0; }
    .btn-sm { padding: 0.35rem 0.6rem; font-size: 0.8rem; margin: 0; width: auto; }

    /* Performance Rating Badges */
    .rating-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .rating-up { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
    .rating-down { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    .rating-same { background: rgba(107, 114, 128, 0.2); color: var(--gray); border: 1px solid var(--gray); }

    /* Flashing Slide Toast Notification */
    .toast-container {
      position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
      z-index: 1000; width: 90%; max-width: 400px; pointer-events: none;
    }

    .toast {
      background: var(--card-bg); border: 2px solid var(--accent);
      color: var(--text); padding: 0.85rem 1.25rem; border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; font-weight: 600;
      opacity: 0; display: none;
    }

    .toast.show {
      display: block;
      animation: slideFlash 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes slideFlash {
      0% { transform: translateY(-100%); opacity: 0; }
      15% { transform: translateY(0); opacity: 1; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
      30% { border-color: var(--green); box-shadow: 0 0 25px var(--green); }
      45% { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
      85% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100%); opacity: 0; }
    }

    /* Timer Drawer Modal */
    .timer-drawer {
      position: fixed; bottom: -100%; left: 0; right: 0; background: var(--card-bg);
      border-top: 2px solid var(--accent); padding: 1.5rem; transition: bottom 0.3s ease;
      z-index: 200; max-width: 600px; margin: 0 auto; border-radius: 16px 16px 0 0;
    }
    .timer-drawer.open { bottom: 0; }
    .timer-display { font-size: 2.5rem; font-weight: bold; text-align: center; margin: 0.5rem 0; color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <h1>Gotti 2-Split Tracker Pro</h1>
  </header>

  <!-- Flashing Toast Banner -->
  <div class="toast-container">
    <div id="toast" class="toast">Notification</div>
  </div>

  <div class="container">
    <!-- Log Date & Split Selection -->
    <div class="card">
      <div class="grid-2">
        <div>
          <label for="logDate">Date</label>
          <input type="date" id="logDate" />
        </div>
        <div>
          <label for="splitType">Workout Split</label>
          <select id="splitType" onchange="renderWorkoutInputs()">
            <option value="Upper">Upper Body</option>
            <option value="Lower">Lower Body</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Dynamic Exercise Inputs -->
    <div class="card">
      <div class="card-title">
        <span>Exercises</span>
        <button class="btn btn-secondary btn-sm" onclick="addExerciseField()">+ Add Movement</button>
      </div>
      <div id="exerciseContainer"></div>
    </div>

    <!-- Data Management -->
    <div class="card">
      <div class="card-title">Data Backup</div>
      <div class="grid-2">
        <button class="btn btn-secondary" onclick="exportData()">Export JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Import JSON</button>
      </div>
      <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)" />
    </div>

    <!-- Workout History Display -->
    <div class="card">
      <div class="card-title">History & Performance</div>
      <div id="historyContainer"></div>
    </div>
  </div>

  <!-- Sticky Bottom Actions -->
  <div class="sticky-actions">
    <button class="btn btn-secondary" style="flex: 1;" onclick="toggleTimerDrawer()">⏱ Rest Timer (<span id="timerQuickVal">01:30</span>)</button>
    <button class="btn btn-primary" style="flex: 2;" onclick="saveWorkout()">Save Workout</button>
  </div>

  <!-- Rest Timer Modal Drawer -->
  <div id="timerDrawer" class="timer-drawer">
    <div class="card-title">
      <span>Rest Timer</span>
      <button class="btn btn-secondary btn-sm" onclick="toggleTimerDrawer()">Close</button>
    </div>
    <div class="timer-display" id="timerDisplay">01:30</div>
    <div class="grid-2">
      <button class="btn btn-primary" onclick="startTimer()">Start</button>
      <button class="btn btn-secondary" onclick="pauseTimer()">Pause</button>
    </div>
    <div class="grid-2" style="margin-top: 0.5rem;">
      <button class="btn btn-secondary" onclick="adjustTimer(10)">+10s</button>
      <button class="btn btn-secondary" onclick="adjustTimer(-10)">-10s</button>
    </div>
  </div>

  <script>
    // Split Definitions
    const splitPresets = {
      Upper: ["Bench Press", "Incline DB Press", "Bent-Over Row", "Lat Pulldown", "Overhead Press"],
      Lower: ["Barbell Squat", "Romanian Deadlift", "Leg Press", "Leg Curl", "Calf Raise"]
    };

    let timerInterval = null;
    let timerSeconds = 90;
    let timerInitial = 90;

    document.addEventListener("DOMContentLoaded", () => {
      // Set today's date
      const today = new Date().toISOString().split("T")[0];
      const logDateInput = document.getElementById("logDate");
      logDateInput.value = today;

      logDateInput.addEventListener("change", loadCurrentDateData);
      
      loadCurrentDateData();
      renderHistory();
    });

    // 1. Auto-load Current Day's Data if exists
    function loadCurrentDateData() {
      const selectedDate = document.getElementById("logDate").value;
      const history = getStoredData();
      const existingEntry = history.find(entry => entry.date === selectedDate);

      const container = document.getElementById("exerciseContainer");
      container.innerHTML = "";

      if (existingEntry) {
        document.getElementById("splitType").value = existingEntry.split;
        existingEntry.exercises.forEach(ex => addExerciseField(ex.name, ex.weight, ex.reps));
        showToast(`Loaded saved workout for ${selectedDate}`);
      } else {
        // Load defaults based on split
        const currentSplit = document.getElementById("splitType").value;
        splitPresets[currentSplit].forEach(name => addExerciseField(name, "", ""));
      }
    }

    function renderWorkoutInputs() {
      loadCurrentDateData();
    }

    function addExerciseField(name = "", weight = "", reps = "") {
      const container = document.getElementById("exerciseContainer");
      const row = document.createElement("div");
      row.className = "exercise-row grid-3";
      row.innerHTML = `
        <input type="text" placeholder="Exercise" value="${name}" class="ex-name" />
        <input type="number" placeholder="kg/lbs" value="${weight}" class="ex-weight" />
        <input type="number" placeholder="Reps" value="${reps}" class="ex-reps" />
      `;
      container.appendChild(row);
    }

    // 2. Storage Helpers
    function getStoredData() {
      return JSON.parse(localStorage.getItem("gotti_workouts") || "[]");
    }

    function saveStoredData(data) {
      localStorage.setItem("gotti_workouts", JSON.stringify(data));
    }

    // 3. Save Workout
    function saveWorkout() {
      const date = document.getElementById("logDate").value;
      const split = document.getElementById("splitType").value;
      
      const rows = document.querySelectorAll(".exercise-row");
      const exercises = [];

      rows.forEach(row => {
        const name = row.querySelector(".ex-name").value.trim();
        const weight = parseFloat(row.querySelector(".ex-weight").value) || 0;
        const reps = parseInt(row.querySelector(".ex-reps").value) || 0;
        if (name) exercises.push({ name, weight, reps });
      });

      if (exercises.length === 0) {
        showToast("Add at least one exercise!");
        return;
      }

      let history = getStoredData();
      const existingIdx = history.findIndex(entry => entry.date === date);

      const workoutEntry = { date, split, exercises };

      if (existingIdx >= 0) {
        history[existingIdx] = workoutEntry;
      } else {
        history.push(workoutEntry);
      }

      // Sort chronologically
      history.sort((a, b) => new Date(b.date) - new Date(a.date));
      saveStoredData(history);

      showToast("Workout Saved Successfully!");
      renderHistory();
    }

    // 4. Performance Rating Calculation (Green, Red, Gray)
    function calculateRating(currentWorkout, previousWorkout) {
      if (!previousWorkout) return { label: "▶ Same", class: "rating-same" };

      let currentVolume = 0;
      let previousVolume = 0;

      currentWorkout.exercises.forEach(ex => currentVolume += (ex.weight * ex.reps));
      previousWorkout.exercises.forEach(ex => previousVolume += (ex.weight * ex.reps));

      if (currentVolume > previousVolume) {
        return { label: "▲ Increased", class: "rating-up" };
      } else if (currentVolume < previousVolume) {
        return { label: "▼ Decreased", class: "rating-down" };
      }
      return { label: "▶ Same", class: "rating-same" };
    }

    // 5. Render History with Ratings
    function renderHistory() {
      const history = getStoredData();
      const container = document.getElementById("historyContainer");
      container.innerHTML = "";

      if (history.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem;">No saved workouts found.</p>`;
        return;
      }

      history.forEach((entry, idx) => {
        // Find previous workout of SAME split
        const previousSameSplit = history.slice(idx + 1).find(prev => prev.split === entry.split);
        const rating = calculateRating(entry, previousSameSplit);

        const card = document.createElement("div");
        card.style.cssText = "background:#0f172a; padding:0.75rem; border-radius:8px; margin-bottom:0.5rem; border:1px solid var(--border);";
        
        let exListHTML = entry.exercises.map(e => `<li>${e.name}: <strong>${e.weight} kg/lbs</strong> × <strong>${e.reps} reps</strong></li>`).join("");

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <div>
              <strong>${entry.date}</strong> <span style="color:var(--text-muted); font-size:0.8rem;">(${entry.split})</span>
            </div>
            <span class="rating-badge ${rating.class}">${rating.label}</span>
          </div>
          <ul style="font-size:0.85rem; padding-left:1.2rem; color:var(--text-muted);">
            ${exListHTML}
          </ul>
        `;
        container.appendChild(card);
      });
    }

    // 6. Fixed Export / Import Functionality
    function exportData() {
      const history = getStoredData();
      if (history.length === 0) {
        showToast("No workout data to export!");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(history, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Gotti_Workout_Backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("JSON Export Downloaded!");
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed)) {
            saveStoredData(parsed);
            showToast("Import successful!");
            loadCurrentDateData();
            renderHistory();
          } else {
            showToast("Invalid JSON structure.");
          }
        } catch (err) {
          showToast("Failed to parse JSON file.");
        }
      };
      reader.readAsText(file);
    }

    // 7. Flashing Toast Banners
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.classList.remove("show");
      void toast.offsetWidth; // Trigger reflow
      toast.classList.add("show");
    }

    // 8. Rest Timer Logic
    function toggleTimerDrawer() {
      document.getElementById("timerDrawer").classList.toggle("open");
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
      const secs = String(timerSeconds % 60).padStart(2, "0");
      const formatted = `${mins}:${secs}`;
      document.getElementById("timerDisplay").innerText = formatted;
      document.getElementById("timerQuickVal").innerText = formatted;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          showToast("⏰ Rest Timer Expired!");
          if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
    }

    function adjustTimer(amount) {
      timerSeconds = Math.max(0, timerSeconds + amount);
      updateTimerDisplay();
    }
  </script>
</body>
</html>
